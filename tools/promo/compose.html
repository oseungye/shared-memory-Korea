<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../vendor/qrcode-generator/qrcode.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(ellipse at 20% 0%,#fbf8f1 0%,#f5f1e8 55%,#efe7d6 100%);font-family:'Noto Sans KR',sans-serif;color:#1a1a1a;word-break:keep-all;position:relative}
.layer{position:absolute;inset:0}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:18px;z-index:5}
.brand .seal{width:68px;height:68px;background:#8b3a3a;color:#f5f1e8;font-family:'Noto Serif KR',serif;font-weight:700;font-size:44px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.brand span{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:500;letter-spacing:.02em}
.cap{position:absolute;left:64px;right:40px;top:150px;z-index:5}
.kick{display:inline-block;background:#8b3a3a;color:#f5f1e8;font-size:30px;font-weight:700;padding:8px 22px;border-radius:999px;letter-spacing:.04em}
.big{font-family:'Noto Serif KR',serif;font-weight:700;font-size:64px;line-height:1.2;margin-top:14px;white-space:nowrap}
.big em{font-style:normal;color:#8b3a3a}
.phone{position:absolute;left:90px;top:330px;width:900px;height:1485px;border-radius:44px;overflow:hidden;background:#f5f1e8;box-shadow:0 30px 70px rgba(60,40,20,.22),0 0 0 3px #e8d5b7;z-index:2}
.phone img{position:absolute;left:0;top:0;width:900px}
.note{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:26px;color:#6f685f;z-index:6}
.note b{display:inline-block;border:2px solid #b9a98e;border-radius:8px;padding:2px 12px;margin-right:10px;font-weight:700;color:#6f685f}
.tap{position:absolute;border-radius:50%;border:8px solid #8b3a3a;z-index:8;pointer-events:none}
.dot{position:absolute;border-radius:50%;background:rgba(139,58,58,.35);z-index:8}
/* intro */
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.intro .bigseal{width:150px;height:150px;background:#8b3a3a;color:#f5f1e8;font-family:'Noto Serif KR',serif;font-weight:700;font-size:100px;display:flex;align-items:center;justify-content:center;border-radius:10px;margin-bottom:70px}
.intro h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:138px;line-height:1.18}
.intro h1 .r{color:#8b3a3a}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin:60px 60px 0}
.names li{list-style:none;background:#e8d5b7;border-radius:999px;padding:14px 30px;font-family:'Noto Serif KR',serif;font-size:38px;display:flex;align-items:center;gap:12px}
.names li i{width:16px;height:16px;border-radius:50%;display:inline-block}
.names li small{font-family:'Noto Sans KR';font-size:26px;color:#6f685f}
.ask{font-family:'Noto Serif KR',serif;font-weight:700;font-size:84px;margin-top:80px;color:#1a1a1a}
.ask u{text-decoration:none;color:#8b3a3a}
.cards{position:absolute;top:470px;left:40px;right:40px;display:flex;gap:40px;z-index:2}
.cards img{width:480px;border-radius:18px;box-shadow:0 20px 50px rgba(60,40,20,.18)}
.more{position:absolute;top:1160px;left:0;right:0;text-align:center;font-size:32px;color:#6f685f;z-index:2}
/* outro */
.ocard{position:absolute;left:150px;top:300px;width:780px;height:880px;overflow:hidden;border-radius:10px;box-shadow:0 30px 70px rgba(60,40,20,.25);transform:rotate(-2deg);z-index:2}
.ocard img{width:780px;display:block}
.ocard:after{content:'';position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(transparent,#fffdf8)}
.cta{position:absolute;left:64px;right:64px;top:1240px;display:flex;align-items:center;gap:48px;z-index:3}
.qr{width:330px;height:330px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 0 0 4px #8b3a3a;flex:none}
.qr svg{width:100%;height:100%;display:block}
.cta h2{font-family:'Noto Serif KR',serif;font-weight:700;font-size:80px;line-height:1.18}
.cta h2 em{font-style:normal;color:#8b3a3a}
.cta p{font-size:32px;color:#4a453f;margin-top:22px;line-height:1.5}
.url{position:absolute;left:0;right:0;top:1650px;text-align:center;font-size:30px;color:#8b3a3a;font-weight:500;z-index:3}
</style></head><body>
<div class="brand" id="brand"><div class="seal">共</div><span>Shared Memory</span></div>
<div class="layer intro" id="intro">
  <div class="bigseal">共</div>
  <h1><span id="l1">같은 역사,</span><br><span class="r" id="l2">다른 시선.</span></h1>
  <ul class="names" id="names">
    <li><i style="background:#c8364b"></i><small>한국</small>임진왜란</li>
    <li><i style="background:#2c3e7e"></i><small>일본</small>文禄・慶長の役</li>
    <li><i style="background:#d4a017"></i><small>중국</small>万历朝鲜战争</li>
  </ul>
  <p class="ask" id="ask">너는 <u>어떻게</u> 기억해?</p>
</div>
<div class="cap" id="cap"><span class="kick" id="kick"></span><p class="big" id="big"></p></div>
<div class="cards" id="cards"><img id="cImjin" src="shots2/03-card-imjin.png"><img id="cZai" src="shots2/03-card-zainichi.png"></div>
<p class="more" id="more">임진왜란 · 재일조선인 외에도 4개의 사건이 더 있어요</p>
<div class="phone" id="phone"><img id="imgA"><img id="imgB"></div>
<div class="ocard" id="ocard"><img src="shots2/08-card.png"></div>
<div class="cta" id="cta"><div class="qr" id="qr"></div><div><h2>지금<br><em>참여해 보세요!</em></h2><p>QR 찍고 3–5분<br>로그인 없이 · 익명 · 정답 없음</p></div></div>
<p class="url" id="url">oseungye.github.io/shared-memory-Korea</p>
<p class="note" id="note"><b>예시</b>실제 사이트 화면 · 입력 문장은 예시이며 실제 학생 응답이 아닙니다</p>
<div class="tap" id="tap"></div><div class="dot" id="dot"></div>
<script>
const URL_='https://oseungye.github.io/shared-memory-Korea/';
const q=qrcode(0,'M');q.addData(URL_);q.make();document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const fadeIn=(t,s,d=.35)=>ease((t-s)/d);
// 전화 화면 속 캡처 (시작 시각, 파일, 세로 이동 px[선택])
const SHOTS=[
 [4.0,'01-home-picks'],[7.0,'02-step1-top'],
 [8.0,'03-narr-1'],[8.85,'03-narr-2'],[9.7,'03-narr-3'],
 [10.6,'04-q1-empty'],[11.45,'05-q1-picked',false,'cut'],
 [12.3,'04-q2-empty',false,'cut'],[12.95,'05-q2-picked',false,'cut'],
 [13.7,'04-q3-empty',false,'cut'],[14.2,'05-q3-picked',false,'cut'],
 [15.0,'06-type-0'],[15.5,'06-type-1',false,'cut'],[16.0,'06-type-2',false,'cut'],[16.5,'06-type-3',false,'cut'],
 [17.9,'07-card-page'],[18.6,'08-card',true]
];
const CAPS=[
 [4.0,'바로 시작','<em>카드 한 번</em>이면 시작'],
 [7.0,'STEP 1 · 세 나라 비교','같은 전쟁, <em>세 개의 기록</em>'],
 [8.0,'STEP 1 · 세 나라 비교','한국 · <em>왜의 침략</em>'],
 [8.85,'STEP 1 · 세 나라 비교','일본 · <em>대륙 진출과 출병</em>'],
 [9.7,'STEP 1 · 세 나라 비교','중국 · <em>의로운 전쟁</em>'],
 [10.6,'STEP 2 · 관점 고르기','<em>정답 없는</em> 객관식'],
 [12.3,'STEP 2 · 관점 고르기','<em>내가 중요하게</em> 보는 것'],
 [15.0,'STEP 3 · 한 줄 소감','<em>내 말로</em> 한 줄'],
 [17.9,'STEP 4 · My Memory Card','<em>나만의 카드</em> 완성!']
];
// 탭 위치: 화면 css 좌표 → 캡처(×2.7) → 전화 틀(×930/1080) + 틀 위치
const S=2.7*900/1080, PX=90, PY=330;
const NEXT=[94+147,599+26];
const TAPS=[
 {t:6.3, css:[16+184,150+58]},
 {t:10.35, css:[12+188,599+26]},
 {t:11.2, css:[16+184,209+37]},{t:12.05, css:NEXT},
 {t:12.7, css:[16+184,359+28]},{t:13.45, css:NEXT},
 {t:13.95, css:[16+184,240+28]},{t:14.7, css:NEXT},
 {t:17.45, css:NEXT}
];
function setImg(el,name){const src='shots2/'+name+'.png';if(el.dataset.n!==src){el.src=src;el.dataset.n=src;}}
function render(t){
  // 1. 도입
  const introOn=t<4;
  $('intro').style.opacity=introOn?(1-ease((t-3.7)/.3)):0;
  $('l1').style.opacity=fadeIn(t,.15);$('l2').style.opacity=fadeIn(t,.6);
  $('names').style.opacity=fadeIn(t,1.2);$('names').style.transform=`translateY(${(1-fadeIn(t,1.2))*30}px)`;
  $('ask').style.opacity=fadeIn(t,2.0);$('ask').style.transform=`translateY(${(1-fadeIn(t,2.0))*30}px)`;
  $('brand').style.opacity=t<3.9?0:fadeIn(t,3.9,.3);
  // 자막
  let cap=null;for(const c of CAPS)if(t>=c[0])cap=c;
  const capOn=t>=4&&t<20;
  $('cap').style.opacity=capOn&&cap?fadeIn(t,cap[0],.22)*(t>19.75?1-ease((t-19.75)/.25):1):0;
  $('cap').style.transform=cap?`translateY(${(1-fadeIn(t,cap[0],.22))*24}px)`:'';
  if(cap){$('kick').textContent=cap[1];$('big').innerHTML=cap[2];}
  // 2. 사건 카드 두 장
  const cardsOn=false;
  $('cards').style.opacity=cardsOn?fadeIn(t,4.05,.3)*(t>7?1-ease((t-7)/.3):1):0;
  $('more').style.opacity=$('cards').style.opacity;
  const pick=ease((t-6.35)/.35);
  $('cImjin').style.transform=`scale(${1+pick*.04})`;$('cImjin').style.boxShadow=pick>0?`0 0 0 ${6*pick}px #8b3a3a,0 20px 50px rgba(60,40,20,.18)`:'';
  $('cZai').style.opacity=1-pick*.5;
  // 3·4. 전화 화면
  const phoneOn=t>=4.0&&t<20;
  $('phone').style.opacity=phoneOn?fadeIn(t,4.0,.3)*(t>19.7?1-ease((t-19.7)/.3):1):0;
  let cur=-1;SHOTS.forEach((s,i)=>{if(t>=s[0])cur=i});
  if(cur>=0){
    const s=SHOTS[cur],p=SHOTS[cur-1];
    setImg($('imgB'),s[1]);
    if(p){setImg($('imgA'),p[1]);$('imgA').style.opacity=1;$('imgA').style.transform=p[2]?'translateY(0)':''}else $('imgA').style.opacity=0;
    $('imgB').style.opacity=s[3]==='cut'?1:fadeIn(t,s[0],.18);
    if(s[2]){ // 카드: 위에서 아래로 천천히
      const img=$('imgB'),maxPan=Math.max(0,img.naturalHeight*900/img.naturalWidth-1485);const k=ease((t-s[0]-.3)/1.0);img.style.transform=`translateY(${-k*Math.min(maxPan,1100)}px)`;
    } else $('imgB').style.transform='';
  }
  // 5. 마무리
  const outOn=t>=20;
  $('ocard').style.opacity=outOn?fadeIn(t,20,.4):0;
  $('ocard').style.transform=`rotate(-2deg) translateY(${(1-fadeIn(t,20,.4))*60}px)`;
  $('cta').style.opacity=outOn?fadeIn(t,20.6,.4):0;
  $('url').style.opacity=outOn?fadeIn(t,21.0,.4):0;
  const pulse=t>21.5?1+0.03*Math.sin((t-21.5)*Math.PI*1.6):1;
  $('qr').style.transform=`scale(${pulse})`;
  $('note').style.opacity=t>=4?fadeIn(t,4,.3):0;
  // 탭 표시
  let tap=null;for(const k of TAPS)if(t>=k.t&&t<k.t+.5)tap=k;
  if(tap){
    const x=tap.css?PX+tap.css[0]*S:tap.x, y=tap.css?PY+tap.css[1]*S:tap.y;
    const k=(t-tap.t)/.5, r=34+k*46;
    Object.assign($('tap').style,{left:x-r+'px',top:y-r+'px',width:2*r+'px',height:2*r+'px',opacity:1-k,display:'block'});
    Object.assign($('dot').style,{left:x-30+'px',top:y-30+'px',width:'60px',height:'60px',opacity:k<.6?1:1-(k-.6)/.4,display:'block'});
  } else {$('tap').style.display='none';$('dot').style.display='none';}
}
window.render=render;
</script></body></html>
